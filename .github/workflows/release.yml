name: Upload Modular Binaries to Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 0.7015)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  upload-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows] # Extensible to [windows, linux, macos] later
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Build and Package Modular Archives
        run: |
          PLATFORM_DIR="${{ matrix.platform }}"
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          ROOT_DIR="$PWD"

          if [ ! -d "$PLATFORM_DIR" ]; then
            echo "Directory $PLATFORM_DIR does not exist. Skipping."
            exit 0
          fi

          cd "$PLATFORM_DIR"

          echo "=== DEBUG: windows/ directory contents and LFS status ==="
          ls -la
          echo "--- assets/ ---"
          ls -la assets 2>&1 || true
          echo "--- git lfs ls-files ---"
          git lfs ls-files 2>&1 || true
          echo "======================================================"

          if [ "$PLATFORM_DIR" = "windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi

          # Define all core system executables and their output suffix
          CORES=(
            "masquerade:windows"
            "masquerade-GBC:GBc-windows"
            "masquerade-GBA:GBA-windows"
            "masquerade-NES:NES-windows"
            "masquerade-CHIP8:Chip8-windows"
            "masquerade-SI:SpaceInvaders-windows"
            "masquerade-PACMAN:PacMan-windows"
          )

          for core_info in "${CORES[@]}"; do
            EXE_NAME="${core_info%%:*}${EXT}"
            SUFFIX="${core_info##*:}"

            # Check if this specific core executable exists
            if [ -f "$EXE_NAME" ]; then
              echo "Found $EXE_NAME. Creating package..."

              STAGING_DIR="staging_${SUFFIX}"
              mkdir -p "$STAGING_DIR"

              # 1. Copy assets folder and DLLs explicitly
              if [ -d "assets" ]; then
                cp -r "assets" "$STAGING_DIR/"
              else
                echo "DEBUG: 'assets' directory not found in $(pwd)"
              fi
              cp -v ./*.dll "$STAGING_DIR/" 2>&1 || echo "DEBUG: no .dll files matched in $(pwd)"

              # 2. Include LICENSE.md from repository root
              [ -f "$ROOT_DIR/LICENSE.md" ] && cp "$ROOT_DIR/LICENSE.md" "$STAGING_DIR/"

              # 3. Always include OTA and Server utilities in every package
              [ -f "masquerade-OTA${EXT}" ] && cp "masquerade-OTA${EXT}" "$STAGING_DIR/"
              [ -f "masquerade-Server${EXT}" ] && cp "masquerade-Server${EXT}" "$STAGING_DIR/"

              # 4. Copy the specific core emulator executable
              cp "$EXE_NAME" "$STAGING_DIR/"

              echo "=== DEBUG: staging_${SUFFIX} contents ==="
              ls -la "$STAGING_DIR"

              # 5. Create the zip archive at repo root and verify contents
              ZIP_NAME="$ROOT_DIR/masquerade-${SUFFIX}-${TAG_NAME}.zip"
              (cd "$STAGING_DIR" && zip -r "$ZIP_NAME" .)
              unzip -l "$ZIP_NAME"

              rm -rf "$STAGING_DIR"
              echo "Successfully created $ZIP_NAME"
            else
              echo "Skipping $EXE_NAME (not found)."
            fi
          done

          cd ..

      - name: Generate Checksums
        run: |
          sha256sum masquerade-*.zip > SHA256SUMS.txt

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            masquerade-*.zip
            SHA256SUMS.txt
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
