<section class="hero-emulator-section">
  <div class="hero-emulator-frame">
    <div class="window-bar">
      <span class="window-title">MASQUERADE — WEBEMU</span>
      <button id="fullscreen-btn" title="Toggle Fullscreen" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>

    <div class="window-content" id="emulator-container">
      <iframe 
        id="masquerade-frame" 
        src="wasm/masquerade.html" 
        allow="autoplay; gamepad; fullscreen"
        scrolling="no">
      </iframe>
    </div>
  </div>
</section>

<script>
  // Fullscreen and Focus Management
  const fsBtn = document.getElementById('fullscreen-btn');
  const container = document.getElementById('emulator-container');
  const iframe = document.getElementById('masquerade-frame');

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  });

  // Focus canvas inside iframe on click for keyboard inputs
  iframe.addEventListener('load', () => {
    try {
      iframe.contentWindow.addEventListener('click', () => {
        iframe.contentWindow.focus();
      });
    } catch (e) {
      // Handles potential cross-origin restrictions if served across different domains
    }
  });
</script>
